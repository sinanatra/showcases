<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="stylesheet" href="%sveltekit.assets%/style.css" />

    <!-- Primary Meta -->
    <title>Showcases</title>
    <meta
      name="description"
      content="Showcases is a data-driven investigation that visualizes police reports on politically motivated crime, highlighting the growing normalization of xenophobic, transphobic, and homophobic violence, as well as right-wing extremism in Germany."
    />
    <meta name="author" content="Giacomo Nanni" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Showcases — Recoding Right-Wing Extremism" />
    <meta
      property="og:description"
      content="A data-driven visualization of police reports on politically motivated crime, revealing the spread of xenophobic, transphobic, and homophobic violence in Germany."
    />
    <meta property="og:image" content="https://showcases.giacomo.website/cover.png" />
    <meta property="og:url" content="https://showcases.giacomo.website/" />
    <meta property="og:site_name" content="Showcases" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Showcases — Recoding Right-Wing Extremism" />
    <meta
      name="twitter:description"
      content="A data-driven investigation exposing the normalization of xenophobic and right-wing violence in Germany."
    />
    <meta name="twitter:image" content="https://showcases.giacomo.website/cover.png" />
    <meta name="twitter:creator" content="@giacomonanni" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Cutive+Mono&display=swap" rel="stylesheet" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
