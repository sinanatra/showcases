imeldungen/pressemitteilung.925536.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.926812.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.930442.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.931984.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.934128.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.936729.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.936914.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.939201.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.939496.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.944535.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.944555.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.952261.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.963541.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.964472.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.966047.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.968080.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.968420.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.968950.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.976872.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.982671.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.982674.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.993702.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.996237.php\"]},\"path\":\"/texts/alcohol\",\"text\":\"\u003Ch1 data-svelte-h=\\\"svelte-1hre0w6\\\">Blood Alcohol Level\u003C/h1> \u003Cp data-svelte-h=\\\"svelte-116j23z\\\">Alcohol lowers inhibitions and can therefore encourage criminal behaviour. Of 2.132 analyzed police reports from 2019–November 2025, 345 cases (16,2%) mention the consumption of alcohol. Overall the police documented 231 breathalyser tests ranging from 0.00‰ to 4.38‰, and an average of approximate 1.92‰. The specific crimes associated with these incidents correspond to the vast variety of xenophobic, antisemitic, nazi-related and queerphobic crimes documented throughout the entire dataset. Though some offences occur more frequently by actions of an alcoholized person than others. This short deep dive is looking at five usual crimes within the dataset by analyzing certain keywords in combination with alcohol.\u003C/p> \u003Cp data-svelte-h=\\\"svelte-qm57gb\\\">Xenophobic insults and attacks are mentioned in 291 of all police reports, while 73 (25,1%) mention that the offender was alcoholized. Of the 168 antisemitic incidents, 21 cases (12,5%) mention the involvement of alcohol, and so do 23 (10%) of the 230 recorded queerphobic cases.\u003C/p> \u003Cp data-svelte-h=\\\"svelte-8rdy9l\\\">A different picture emerges from following specific nazi-related claims and symbols. The typical vocal and gestic signals “Sieg Heil”, “Heil Hitler”, and the Hitler salute are mentioned in 268 of all cases, while 109 police reports (40,1%) note that the perpetrator was liquorized. On the other hand, only 5 of 521 (1%) of the reported cases mentioning swastikas also include alcohol. The latter can be explained by the fact that most swastika graffiti paintings are linked to unknown suspects. So, the estimated number of alcoholized offenders could be significantly higher.\u003C/p> \u003Cp data-svelte-h=\\\"svelte-85y1q1\\\">To summarize, certain crimes – and especially those related to racism and right-wing extremism – occur more often with the involvement of alcohol than the overall average of cases mentioning alcohol. This is also the case, due to the vast amount of unknown suspects in swastika painting crimes, which make up almost a quarter of all police reports within the dataset. The data does not assume that people are more likely to commit, when drinking alcohol, but it assumes that right-wing extremists are less inhibited to share nazi ideology.\u003C/p>\"},{\"meta\":{\"title\":\"Communication Policies\",\"date\":\"2025-12-15\",\"excerpt\":\"The regional comparison of both state police departments reveals a clear difference in reporting policies in Berlin and Brandenburg. This deep dive gives a glimpse into the distinct public relations cultures of German state police departments.\",\"caption\":\"The visualisation shows all small selection of reports, highlighting differences in the Berlin and Brandenburg police public relations cultures\",\"viz\":\"fungal\",\"loop\":false,\"isPublic\":true,\"urls\":[\"https://polizei.brandenburg.de/pressemeldung/mehrere-fahrzeuge-beschmiert/5457626\",\"https://polizei.brandenburg.de/pressemeldung/schmierereien-an-fassade/5397601\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.880413.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2022/pressemitteilung.1192016.php\",\"https://polizei.brandenburg.de/pressemeldung/hakenkreuze-auf-strassenpflaster-geschmi/3138907\",\"https://polizei.brandenburg.de/pressemeldung/schmierereien-entdeckt/5300222\",\"https://polizei.brandenburg.de/pressemeldung/ein-fall-fuer-den-staatsschutz/5690399\",\"https://polizei.brandenburg.de/pressemeldung/raeuberischer-diebstahl-volksverhetzung/1908443\",\"https://www.berlin.de/polizei/polizeimeldungen/2023/pressemitteilung.1372239.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2025/pressemitteilung.1530830.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2025/pressemitteilung.1606473.php\",\"https://polizei.brandenburg.de/pressemeldung/lautstark-aufgefallen/5669465\",\"https://www.berlin.de/polizei/polizeimeldungen/2025/pressemitteilung.1527267.php\",\"https://polizei.brandenburg.de/pressemeldung/regenbogenfahnen-beschaedigt/5465427\",\"https://polizei.br e/pressemeldung/jugendliche-beschmieren-wahlplakate-mit-/1475549\",\"https://polizei.brandenburg.de/pressemeldung/streit-auf-party/1474442\",\"https://polizei.brandenburg.de/pressemeldung/wer-kann-hinweise-geben-/1380944\",\"https://polizei.brandenburg.de/pressemeldung/unbefugt-auf-dem-tennisplatz/1318413\",\"https://www.berlin.de/polizei/polizeimeldungen/2025/pressemitteilung.1594971.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2025/pressemitteilung.1533560.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2024/pressemitteilung.1487377.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2024/pressemitteilung.1471512.php\",\"https://polizei.brandenburg.de/pressemeldung/die-tiktokisierung-des-islamismus/4748634\",\"https://www.berlin.de/polizei/polizeimeldungen/2023/pressemitteilung.1379761.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2023/pressemitteilung.1377611.php\",\"https://polizei.brandenburg.de/pressemeldung/verfassungsschutz-stuft-islamisches-zent/4072205\",\"https://www.berlin.de/polizei/polizeimeldungen/2023/pressemitteilung.1319388.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2021/pressemitteilung.1121666.php\",\"https://www.berlin.de/polizei/polizeimeldungen/2021/pressemitteilung.1058471.php\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.1055530.php\",\"https://polizei.brandenburg.de/pressemeldung/bilanz-2020-lka-schlaegt-61-tontraeger-f/2352504\",\"https://www.berlin.de/polizei/polizeimeldungen/pressemitteilung.1014774.php\",\"https://polizei.brandenburg.de/pressemeldung/polizeiliche-kriminalstatistik-2019/1888677,\"]},\"path\":\"/texts/youth\",\"text\":\"\u003Ch1 data-svelte-h=\\\"svelte-te7zao\\\">Youth Cases\u003C/h1> \u003Cp data-svelte-h=\\\"svelte-1s1wxzf\\\">Of the 2.111 analyzed police reports from 2019–mid October 2025, 339 mention the involvement of people aged 18 or younger – around 16 percent of all cases. Youth can mostly be classified as either victims (44 percent) or offenders (38 percent), while in roughly one in ten cases they are both (10 percent), either the same individual or group is victim and offender, or two individuals or groups of minors are subjects of the report. In the remaining cases, 8 percent, youth can be described as witnesses or are solely mentioned in protest-related contexts.\u003C/p> \u003Cp data-svelte-h=\\\"svelte-24502l\\\">Beyond these numbers, the reports provide insights into how youth are portrayed in institutional communication and reveal distinct regional reporting biases. Even though the reports tend to have a standardized tone, they pivot towards the complex realities of youth living in Germany. They depict stressful everyday encounters children or minors may have to endure, while presenting symptoms of a growth in nationalist youth groups.\u003C/p> \u003Cp data-svelte-h=\\\"svelte-144kn0j\\\">In Berlin, for example, teenage girls wearing headscarves are targeted by racist attacks. The garment becomes a visual anchor for the projection of aggression and social tension. Violent attempts are made to tear it off from the girls’ heads. Attacked by adults, male and female, the religious symbol is utilized for hate. A case involving two girls aged 14 and 16 illustrates the dangers that teenagers wearing headscarves face:\u003C/p> \u003Cblockquote data-svelte-h=\\\"svelte-1y40jn1\\\">\u003Cp>“According to current findings, two unknown individuals approached them from behind and pulled on their headscarves. This tore the 14-year-old’s headscarf. In the ensuing scuffle, the attackers allegedly struck both girls in the face. Furthermore, one of the men pulled out a pocket knife and inflicted a superficial cut on the 16-year-old’s arm.” (Police Berlin 2025; Translated from German)\u003C/p>\u003C/blockquote> \u003Cp data-svelte-h=\\\"svelte-m6ks4l\\\">Similarly, children are often verbally abused, spat on, pushed or hit. These incidents occur in Berlin and Brandenburg alike, on playgrounds and in public transportation. The offenders are not always adults; minors, too, often seize opportunities to harass those perceived as weaker. They mostly act in group constellations. At a bus stop in Bad Saarow, Brandenburg, for example, a 10-year-old Namibian boy was enveloped in cigarette smoke, racially abused and physically attacked by two teenage girls of around 17 years. The following day, the minors met again and a 10-year-old German girl and peer of the victim was physically punished, too, presumably for being with the boy (Police Brandenburg 2025).\u003C/p> \u003Cp data-svelte-h=\\\"svelte-1ai9ng1\\\">When minors of color become targets, even places of leisure activities can become scenes of racist harm. The football pitch is one of these places. The hatred demonstrated by right-wing fans in the stadiums of professional clubs, is echoed on the local pitch. Neither Brandenburg nor Berlin is an exception.\u003C/p> \u003Cp data-svelte-h=\\\"svelte-2zhu5u\\\">In Berlin, Lichtenberg, a 9-year-old boy was racially insulted, spat on, punched and kicked by two other boys. They pushed the boy against a fence and kicked a football into his face (Police Berlin 2025). Another violent conflict between same aged actors is portrayed in this example from Strausberg, Brandenburg:\u003C/p> \u003Cblockquote data-svelte-h=\\\"svelte-mexohu\\\">\u003Cp>“In the evening hours of 5 October 2024, two apparent youths insulted a young footballer who was accompanied by two teammates in the sports and recreation park and repeatedly threw pyrotechnics in the direction of the footballers. […] Police officers launched investigations into attempted grievous bodily harm, insult and incitement to hatred, which will be handled by the police state security department.” (Police Brandenburg 2024; Translated from German)\u003C/p>\u003C/blockquote> \u003Cp data-svelte-h=\\\"svelte-xw1gfr\\\">The regional comparison of both state police departments reveals a clear difference in how minors appear in police reports. In Berlin, they are predominantly positioned in the role of victims (56 percent), whereas in Brandenburg the majority of youth is described as perpetrators (63 percent). This contrast does not necessarily align with the actual amount of youth involvement in politically motivated crimes in these two federal states (the criminal statistics of Brandenburg do not indicate the number of youth offenses), but could give a glimpse into the distinct public relations cultures of German state police departments.\u003C/p>\"}]"}</script>
