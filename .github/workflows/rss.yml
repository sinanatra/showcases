name: Update and parse RSS feeds

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

# so gh-pages can push
permissions:
  contents: write

jobs:
  update-and-parse-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      # 1. scrape everything new into pipeline/data (unfiltered)
      - name: Scrape RSS feeds
        run: python pipeline/scrape_rss.py

      # 2. filter the full scrape by categories.json -> static/all_merged.csv
      - name: Filter by categories
        run: python pipeline/filter.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Translate new entries
        continue-on-error: true
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node pipeline/translate.mjs --days=30

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add pipeline/data static/all_merged.csv static/translations
          git commit -m "Update and parse RSS feeds" || echo "No changes to commit"
          git push
