name: Update and parse RSS feeds

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

# so gh-pages can push
permissions:
  contents: write

jobs:
  update-and-parse-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        working-directory: notebooks/rss
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS scraper
        working-directory: notebooks/rss
        run: python rss.py

      - name: Run analysis script
        working-directory: notebooks/rss
        run: python analysis.py

      - name: Copy merged CSV
        run: cp notebooks/rss/output/all_merged.csv static/all_merged.csv

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add static/all_merged.csv notebooks/rss/output/all_merged.csv
          git commit -m "Update and parse RSS feeds" || echo "No changes to commit"
          git push

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: update-and-parse-rss
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run deploy
