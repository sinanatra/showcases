name: Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Configure git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build site
        run: npm run build

      # --no-history replaces gh-pages with a single commit each time,
      # so the branch never accumulates old builds.
      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx gh-pages -d build --dotfiles --no-history --cname showcases.giacomo.website \
            -r https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
